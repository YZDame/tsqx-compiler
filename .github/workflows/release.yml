name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.2.0)
        required: true
        type: string
      publishMarketplace:
        description: Also publish to the VS Code Marketplace
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: xvfb-run -a npm run check

      - name: Build VSIX
        run: npx vsce package -o "tsqx-compiler-${RELEASE_TAG}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: tsqx-compiler-${{ env.RELEASE_TAG }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && (github.event_name == 'push' || inputs.publishMarketplace == true) }}
        run: npx vsce publish --packagePath "tsqx-compiler-${RELEASE_TAG}.vsix"
